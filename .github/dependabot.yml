version: 2
updates:
  # minor/patch 合并成一个 PR 降低噪音;major 单独开 PR 便于逐个评估(vite 6→8、marked 15→18 这类)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
