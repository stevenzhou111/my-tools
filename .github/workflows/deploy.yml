name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # 先跑测试再部署:工具注册表是手工维护的数据,挂错分类、图标名写错
    # 这类问题页面本身不会报错,只有测试能挡住
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_cf: ${{ steps.check.outputs.has_cf }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "has_cf=$([[ -n "$TOKEN" && -n "$ACCOUNT" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    # 测试全绿且已配置 Cloudflare 凭据才部署;未配置时自动跳过,不影响 CI 显示绿色
    needs: [test, check-secrets]
    if: needs.check-secrets.outputs.has_cf == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 已验证归属:https://my-tools-11w.pages.dev
          command: pages deploy dist --project-name=my-tools-11w